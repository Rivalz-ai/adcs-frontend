name: deploy-adcs-frontend

on:
  push:
    branches: 
      - 'main'
      - 'testnet'
      - 'staging'
env:
  REPO_URL: "asia-southeast1-docker.pkg.dev/rivalz-be/adcs"   #sjc.vultrcr.com/rome"
  SERVICE_NAME: "adcs-frontend"
  NAMESPACE: "adcs"

jobs:
  build:
    runs-on: rivalz-fe
    outputs: 
      commit_hash: ${{ steps.build-image.outputs.COMMIT_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: build and push image
        id: build-image
        run: |
          mv .env.${{ github.ref_name }} .env
          commit_hash=$(git rev-parse --short $GITHUB_SHA)
          docker build -t ${REPO_URL}/${SERVICE_NAME}:${commit_hash} -t ${REPO_URL}/${SERVICE_NAME}:${{ github.ref_name }}-latest .
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d | docker login -u _json_key --password-stdin asia-southeast1-docker.pkg.dev
          docker push ${REPO_URL}/${SERVICE_NAME}:${commit_hash}
          docker push ${REPO_URL}/${SERVICE_NAME}:${{ github.ref_name }}-latest
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT
  deploy:
    runs-on: rivalz-dc
    needs: build 
    env:
      COMMIT_HASH: ${{ needs.build.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: "Rivalz-ai/rivalz-helm-chart.git"
          path: rivalz-chart
          ref: main
      - run: |
          if [[ ${{ github.ref_name }} == "staging" ]]; then
            NAMESPACE="staging-${NAMESPACE}"
          fi
          if [[ ${{ github.ref_name }} == "testnet" ]]; then
            NAMESPACE="testnet-${NAMESPACE}"
          fi
          echo "${{ vars.DC_KUBECONFIG }}" | base64 -d >> kubeconfig
          helm upgrade --install ${SERVICE_NAME} rivalz-chart -f values.${{ github.ref_name }}.yaml -n ${NAMESPACE} \
            --kubeconfig kubeconfig \
            --set image.tag=${COMMIT_HASH} \
            --create-namespace
          rm -rf kubeconfig
          echo "${{ vars.ROME_KUBECONFIG }}" | base64 -d >> kubeconfig
          helm upgrade --install ${SERVICE_NAME} rivalz-chart -f values.${{ github.ref_name }}.yaml -n ${NAMESPACE} \
            --kubeconfig kubeconfig \
            --set image.tag=${COMMIT_HASH} \
            --create-namespace
